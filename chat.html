<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- URL（#以降の合言葉）を受け取った人だけが使うページ。検索に載せない -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- ▲ 読み書きする先は Web チャットの関数だけ（手元で確かめるときだけ localhost）。
       中身は textContent で入れているが、万一の差し込みでもよその宛先へ送れないように絞る -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://fikjpmotklstfvdvrrxp.supabase.co http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https://fikjpmotklstfvdvrrxp.supabase.co http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
  <title>チャット</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --chat-bg: #eef1f5;
      --bubble-owner: #ffffff;
      --bubble-guest: #c9efb4;
      --bubble-text: #1c1c1e;
      --pill: #dfe3e8;
      --pill-text: #3c4043;
      --danger: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --chat-bg: #17181b;
        --bubble-owner: #2c2d31;
        --bubble-guest: #2f5a28;
        --bubble-text: #f2f2f5;
        --pill: #2c2d31;
        --pill-text: #c4c4ca;
        --danger: #ff8a80;
      }
    }

    /* ▲ id で display を決めた要素（#chat など）は、hidden 属性の display: none に勝ってしまう。必ず隠れるようにする */
    [hidden] { display: none !important; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    /* チャットのあいだは画面の高さに収め、やり取りの欄だけをスクロールさせる（入力欄を常に下に出す） */
    body.chat-mode { height: 100dvh; overflow: hidden; }

    header.chat-head {
      position: sticky; top: 0; z-index: 2;
      background: var(--bg); border-bottom: 1px solid var(--rule);
      padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    }
    .chat-head h1 { font-size: 1.1rem; margin: 0; line-height: 1.4; overflow-wrap: anywhere; }
    .chat-head p { margin: 0; }

    .panel { max-width: 520px; width: 100%; margin: 32px auto; padding: 0 16px; }
    .panel h2 { border-top: none; margin-top: 0; padding-top: 0; }
    .panel label { display: block; font-weight: 600; margin: 16px 0 6px; }
    .panel input {
      width: 100%; font: inherit; font-size: 1.05rem; padding: 10px 12px; min-height: 44px;
      color: var(--text); background: var(--bg); border: 1px solid var(--rule); border-radius: 10px;
    }
    .panel input.code { letter-spacing: 0.4em; font-variant-numeric: tabular-nums; }
    button.primary, button.secondary {
      font: inherit; min-height: 44px; padding: 8px 18px; border-radius: 10px; cursor: pointer;
    }
    button.primary { color: #fff; background: var(--accent); border: 1px solid var(--accent); font-weight: 600; }
    button.primary:disabled { opacity: 0.5; cursor: default; }
    button.secondary { color: var(--accent); background: none; border: 1px solid var(--rule); }
    .panel .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .error { color: var(--danger); font-size: 0.95rem; margin: 8px 0 0; }

    #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--chat-bg); }
    #log {
      flex: 1; overflow-y: auto; padding: 12px 12px 16px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .day-pill {
      align-self: center; margin: 12px 0 6px; padding: 2px 12px; border-radius: 999px;
      background: var(--pill); color: var(--pill-text); font-size: 0.8rem;
    }
    .row { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
    .row.guest { flex-direction: row-reverse; }
    .bubble {
      max-width: min(78%, 34em); padding: 8px 12px; border-radius: 16px;
      color: var(--bubble-text); background: var(--bubble-owner);
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6;
    }
    .row.guest .bubble { background: var(--bubble-guest); }
    .row.owner .bubble { border-bottom-left-radius: 6px; }
    .row.guest .bubble { border-bottom-right-radius: 6px; }
    .meta { font-size: 0.72rem; color: var(--muted); white-space: nowrap; line-height: 1.3; text-align: right; }
    .row.owner .meta { text-align: left; }
    .meta .failed { color: var(--danger); }
    .meta button, footer.chat-foot button {
      font: inherit; color: var(--accent); background: none; border: none; cursor: pointer;
      min-height: 36px; padding: 4px 6px; text-decoration: underline;
    }
    .empty { align-self: center; margin: auto; color: var(--muted); font-size: 0.9rem; text-align: center; padding: 24px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    #newer {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 88px;
      font: inherit; font-size: 0.85rem; padding: 6px 14px; min-height: 36px; border-radius: 999px;
      color: #fff; background: var(--accent); border: none; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    #banner { margin: 0; padding: 8px 16px; font-size: 0.9rem; background: var(--pill); color: var(--pill-text); }
    #banner button { margin-left: 8px; }

    form.composer {
      display: flex; gap: 8px; align-items: flex-end;
      padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
      background: var(--bg); border-top: 1px solid var(--rule);
    }
    form.composer textarea {
      flex: 1; min-width: 0; resize: none; font: inherit; line-height: 1.5;
      min-height: 44px; max-height: 40vh; padding: 9px 12px;
      color: var(--text); background: var(--bg); border: 1px solid var(--rule); border-radius: 18px;
    }
    form.composer button { flex: none; border-radius: 18px; }
    .counter { font-size: 0.75rem; color: var(--muted); padding: 0 16px 4px; background: var(--bg); text-align: right; }
    .counter.over { color: var(--danger); }

    /* 添付（画像・ファイル） */
    .bubble.media { padding: 4px; background: transparent; }
    .row .bubble.media { background: transparent; }
    .attach-image {
      display: block; padding: 0; border: none; background: var(--pill); cursor: zoom-in;
      border-radius: 14px; overflow: hidden; max-width: 100%;
    }
    /* 取りに行く前は代わりの文字（alt）と壊れた絵の印を出さない（読み込み中の灰色の箱だけ見せる） */
    .attach-image img:not([src]) { visibility: hidden; }
    .attach-image img { display: block; max-width: min(240px, 60vw); max-height: 320px; min-width: 80px; min-height: 60px; object-fit: cover; }
    .file-card {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px;
      background: var(--bubble-owner); color: var(--bubble-text); max-width: min(78vw, 22em);
    }
    .row.guest .file-card { background: var(--bubble-guest); }
    /* 印の地はやり取りの欄の地の色（吹き出しの色と重ならない。暗い外観では --pill が受けた吹き出しと同じ色） */
    .file-card .icon { flex: none; width: 36px; height: 36px; border-radius: 8px; background: var(--chat-bg); color: var(--pill-text);
      display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
    .file-card .fname { font-weight: 600; overflow-wrap: anywhere; line-height: 1.4; }
    .file-card .fsize { font-size: 0.8rem; color: var(--muted); }
    .file-card button { margin-top: 4px; font: inherit; font-size: 0.85rem; color: var(--accent); background: none; border: none; padding: 4px 0;
      min-height: 32px; cursor: pointer; text-decoration: underline; }
    .lightbox {
      position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, 0.88);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
    }
    .lightbox img { max-width: 100%; max-height: calc(100dvh - 120px); object-fit: contain; border-radius: 8px; }
    .lightbox-bar { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; }
    .lightbox-bar button {
      font: inherit; color: #fff; background: rgba(255, 255, 255, 0.18); border: none; border-radius: 18px;
      min-height: 44px; padding: 6px 16px; cursor: pointer;
    }
    form.composer .attach {
      flex: none; width: 44px; min-height: 44px; padding: 0; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
    }
    form.composer .attach svg { width: 22px; height: 22px; }
    #attach-error { margin: 0; padding: 4px 16px 0; background: var(--bg); }

    footer.chat-foot { padding: 6px 16px 10px; background: var(--bg); font-size: 0.75rem; color: var(--muted); line-height: 1.5; }
    footer.chat-foot a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="chat-head">
    <h1 id="title">チャット</h1>
    <p class="muted" id="subtitle">業務管理（GyomuKanri）のチャット</p>
  </header>

  <!-- 読み込み中・見つからない・通信できない -->
  <section id="status" class="panel" role="status" aria-live="polite">
    <p>読み込んでいます…</p>
  </section>

  <!-- 合言葉 -->
  <section id="passcode" class="panel" hidden>
    <h2>合言葉を入れてください</h2>
    <p class="muted">このチャットには合言葉が設定されています。URL を送ってくれた相手から受け取った6桁の数字を入れてください。</p>
    <form id="passcode-form" novalidate>
      <label for="passcode-input">合言葉（6桁の数字）</label>
      <input id="passcode-input" class="code" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" pattern="[0-9]{6}" required>
      <p id="passcode-error" class="error" role="alert" hidden></p>
      <div class="actions"><button type="submit" class="primary" id="passcode-submit">開く</button></div>
    </form>
  </section>

  <!-- 名前 -->
  <section id="name" class="panel" hidden>
    <h2>お名前を入れてください</h2>
    <p class="muted" id="name-help">チャットの相手に表示されます。</p>
    <form id="name-form" novalidate>
      <label for="name-input">お名前</label>
      <input id="name-input" autocomplete="name" required>
      <p id="name-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="primary" id="name-submit">はじめる</button>
        <button type="button" class="secondary" id="name-cancel" hidden>やめる</button>
      </div>
    </form>
  </section>

  <!-- チャット -->
  <section id="chat" hidden>
    <p id="banner" role="status" hidden></p>
    <div style="position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0;">
      <div id="log" role="log" aria-live="polite" aria-relevant="additions text" aria-label="やり取り"></div>
      <button type="button" id="newer" hidden>新しいメッセージ ↓</button>
    </div>
    <div id="counter" class="counter" hidden></div>
    <p id="attach-error" class="error" role="alert" hidden></p>
    <form class="composer" id="composer" novalidate>
      <button type="button" class="secondary attach" id="attach" aria-label="画像・ファイルを送る" title="画像・ファイルを送る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="file-input" multiple hidden
             accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.heic,.heif,.pdf,.txt,.csv,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
      <label for="text" class="sr-only">メッセージ</label>
      <textarea id="text" rows="1" placeholder="メッセージを入力" enterkeyhint="enter"></textarea>
      <button type="submit" class="primary" id="send">送信</button>
    </form>
    <footer class="chat-foot">
      <span id="me"></span><button type="button" id="rename" hidden>名前を変える</button>
      やり取りは業務管理（GyomuKanri）のサーバーに保存され、相手のアプリに表示されます。
      <a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
    </footer>
  </section>

  <script>
  (() => {
    "use strict";

    // ▲ 合言葉は URL の # 以降に置く。# 以降はブラウザから GitHub のサーバーへ送られないので、
    //   このページの置き場所には残らない。関数へも**本文**に入れて送る（パスに置くとアクセスログに残る）
    const API = "https://fikjpmotklstfvdvrrxp.supabase.co/functions/v1/webchat";
    const TOKEN_PATTERN = /^[A-Za-z0-9_-]{43}$/;
    const ZONE = "Asia/Tokyo";
    const POLL_MS = 15000;
    const MAX_CHARS = 5000;   // サーバー（checkSendText）と同じ。数えるのはコードポイント
    const MAX_NAME = 50;

    // 添付（第2段）。▲ 許可リスト・上限・断りの文は**サーバー（_shared/webchat.ts）とアプリと同じ**。片方だけ直さないこと。
    // 種類は拡張子から決める（ブラウザの file.type は OS で揺れる ―― CSV が application/vnd.ms-excel になる等）
    const IMAGE_MAX = 10 * 1024 * 1024;
    const FILE_MAX = 20 * 1024 * 1024;
    const NAME_MAX = 200;              // コードポイント
    const REENCODE_EDGE = 2560;        // 画像を描き直すときの長い辺
    const REENCODE_QUALITY = 0.85;
    const ALLOWED = {
      jpg: ["image/jpeg", "image"], jpeg: ["image/jpeg", "image"], png: ["image/png", "image"],
      gif: ["image/gif", "image"], webp: ["image/webp", "image"], heic: ["image/heic", "image"], heif: ["image/heif", "image"],
      pdf: ["application/pdf", "file"], txt: ["text/plain", "file"], csv: ["text/csv", "file"], zip: ["application/zip", "file"],
      doc: ["application/msword", "file"],
      docx: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "file"],
      xls: ["application/vnd.ms-excel", "file"],
      xlsx: ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "file"],
      ppt: ["application/vnd.ms-powerpoint", "file"],
      pptx: ["application/vnd.openxmlformats-officedocument.presentationml.presentation", "file"],
    };
    const TOO_LARGE = "画像は 10MB まで、ファイルは 20MB までです。";
    const NOT_ALLOWED = "この種類のファイルは送れません（画像・PDF・Word・Excel・PowerPoint・テキスト・CSV・ZIP）。";

    const $ = (id) => document.getElementById(id);
    const sections = ["status", "passcode", "name", "chat"];

    // 手元で確かめるとき（localhost）だけ、?api= で読み書きする先を差し替えられる
    let apiURL = API;
    if (["localhost", "127.0.0.1"].includes(location.hostname)) {
      const override = new URLSearchParams(location.search).get("api");
      if (override) apiURL = override;
    }

    // 壊れた断片（#% など）で例外を投げると「読み込んでいます…」のまま固まるので、読めなければ空にする（＝見つからない）
    let token = "";
    try { token = decodeURIComponent(location.hash.slice(1)); } catch { token = ""; }
    let ticket = null;
    let title = "";
    let guestName = null;
    let messages = [];            // サーバーから来た行（古い順）
    let pending = [];             // 送っている途中・送れなかった行 { clientMessageId, body, failed }
    let lastReadByOwnerAt = null;
    let pollTimer = null;
    let polling = false;
    let stopped = false;

    // ---------- 入場券（合言葉を通ったしるし）。保存できないブラウザでも動くように、読み書きは必ず try で包む ----------
    let ticketKey = null;
    async function deriveTicketKey() {
      // 合言葉そのものを保存の鍵にしない（ブラウザの保存領域を覗かれても URL が分からないように、ハッシュの頭だけ使う）
      try {
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(token));
        const hex = [...new Uint8Array(digest)].slice(0, 12).map((b) => b.toString(16).padStart(2, "0")).join("");
        ticketKey = "gyomu-webchat:" + hex;
      } catch { ticketKey = null; }
    }
    function loadTicket() {
      if (!ticketKey) return null;
      try {
        const raw = localStorage.getItem(ticketKey);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (!saved || typeof saved.ticket !== "string") return null;
        if (saved.expiresAt && Date.parse(saved.expiresAt) <= Date.now()) { clearTicket(); return null; }
        return saved.ticket;
      } catch { return null; }
    }
    function saveTicket(value, expiresAt) {
      ticket = value;
      if (!ticketKey) return;
      try { localStorage.setItem(ticketKey, JSON.stringify({ ticket: value, expiresAt })); } catch { /* 保存できなくてもこの画面では使える */ }
    }
    function clearTicket() {
      ticket = null;
      if (!ticketKey) return;
      try { localStorage.removeItem(ticketKey); } catch { /* 何もしない */ }
    }

    // ---------- 通信 ----------
    class ApiError extends Error {
      constructor(status, body) {
        super((body && body.error) || "通信に失敗しました。");
        this.status = status;
        this.body = body || {};
      }
    }
    async function call(action, payload = {}) {
      let response;
      try {
        response = await fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, token, ...(ticket ? { ticket } : {}), ...payload }),
          cache: "no-store",
          credentials: "omit",
          referrerPolicy: "no-referrer",
        });
      } catch {
        throw new ApiError(0, { error: "つながりません。電波の状態を確かめて、もう一度お試しください。" });
      }
      let body = null;
      try { body = await response.json(); } catch { body = null; }
      if (!response.ok) throw new ApiError(response.status, body);
      return body || {};
    }

    // どの操作でも同じ扱いにする失敗（見つからない・合言葉が要る・名前が要る）。扱えたら true
    function handleCommonError(error) {
      if (error.status === 404) { showNotFound(error.message); return true; }
      if (error.status === 401 && error.body.needsPasscode) { clearTicket(); showPasscode(); return true; }
      if (error.status === 409 && error.body.needsName) { showName(); return true; }
      return false;
    }

    // ---------- 画面の切り替え ----------
    function show(id) {
      for (const s of sections) $(s).hidden = s !== id;
      document.body.classList.toggle("chat-mode", id === "chat");
    }
    function setTitle(text) {
      title = text || "";
      const heading = title ? `${title} とのチャット` : "チャット";
      $("title").textContent = heading;
      document.title = heading;
    }
    function showStatus(message, retry) {
      stopPolling();
      show("status");
      const el = $("status");
      el.replaceChildren();
      const p = document.createElement("p");
      p.textContent = message;
      el.appendChild(p);
      if (retry) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";
        button.textContent = "もう一度読み込む";
        button.addEventListener("click", start);
        el.appendChild(button);
      }
    }
    function showNotFound(message) {
      stopped = true;
      clearTicket();
      setTitle("");
      showStatus(message || "このチャットは見つかりません。URL が止められたか、まちがっています。", false);
    }
    function showPasscode(errorText) {
      stopPolling();
      setTitle("");
      show("passcode");
      const err = $("passcode-error");
      err.hidden = !errorText;
      err.textContent = errorText || "";
      $("passcode-input").focus();
    }
    function showName() {
      stopPolling();
      show("name");
      $("name-help").textContent = title
        ? `${title} さんに表示されます。あとから変えることもできます。`
        : "チャットの相手に表示されます。";
      $("name-input").value = guestName || "";
      $("name-submit").textContent = guestName ? "変える" : "はじめる";
      $("name-cancel").hidden = !guestName;
      $("name-input").focus();
    }
    function showChat() {
      show("chat");
      $("me").textContent = guestName ? `あなたの名前: ${guestName}` : "";
      $("rename").hidden = !guestName;
      updateComposer();
      render(true);
      startPolling();
    }

    // ---------- 始める ----------
    async function start() {
      stopped = false;
      if (!TOKEN_PATTERN.test(token)) {
        showNotFound("URL がまちがっています。受け取った URL を最後までそのまま開いてください。");
        return;
      }
      showStatus("読み込んでいます…", false);
      await deriveTicketKey();
      ticket = loadTicket();
      try {
        const opened = await call("open");
        if (opened.needsPasscode) { clearTicket(); showPasscode(); return; }
        setTitle(opened.title);
        guestName = opened.guestName || null;
        if (!guestName) { showName(); return; }
        await refresh(true);
        showChat();
      } catch (error) {
        if (handleCommonError(error)) return;
        showStatus(error.message, true);
      }
    }

    $("passcode-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = $("passcode-input");
      const value = input.value.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).trim();
      if (!/^[0-9]{6}$/.test(value)) { showPasscode("6桁の数字を入れてください。"); return; }
      const submit = $("passcode-submit");
      submit.disabled = true;
      try {
        const result = await call("unlock", { passcode: value });
        saveTicket(result.ticket, result.expiresAt);
        input.value = "";
        await start();
      } catch (error) {
        if (error.status === 404) { showNotFound(error.message); return; }
        if (error.status === 429 && error.body.retryAfter) {
          const minutes = Math.max(1, Math.ceil(error.body.retryAfter / 60));
          showPasscode(`${error.message}（あと${minutes}分ほど）`);
        } else {
          showPasscode(error.message);
        }
        input.select();
      } finally {
        submit.disabled = false;
      }
    });

    $("rename").addEventListener("click", () => showName());
    $("name-cancel").addEventListener("click", () => showChat());

    $("name-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const value = $("name-input").value.trim();
      const err = $("name-error");
      if (!value || [...value].length > MAX_NAME) {
        err.hidden = false;
        err.textContent = `お名前は1〜${MAX_NAME}文字で入れてください。`;
        return;
      }
      err.hidden = true;
      const submit = $("name-submit");
      submit.disabled = true;
      try {
        const result = await call("profile", { name: value });
        guestName = result.guestName || value;
        await refresh(true);
        showChat();
      } catch (error) {
        if (error.status === 404 || (error.status === 401 && error.body.needsPasscode)) { handleCommonError(error); return; }
        err.hidden = false;
        err.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });

    // ---------- 読み込みと見回り ----------
    // ▲ 差分の起点（listCursor）は **list が返した行だけ**から進める。手元の最後の行（自分が送った行を含む）から
    //   取っていたころは、「相手が送る → こちらが送る → 見回り」の順で相手の1通が永久に落ち、しかもその行に
    //   「既読」が付いた（markRead）。自分の行は次の list でも返ってくるので、id で畳めば二重にならない
    let listCursor = null;
    function advanceCursor(rows) {
      for (const m of rows) {
        const at = Date.parse(m.sentAt);
        if (!Number.isNaN(at) && (listCursor === null || at > listCursor)) listCursor = at;
      }
    }
    // full: 初めから読む（after なし）。見回りは after つきで差分だけ。
    // 戻り値は「画面を描き直す必要があるか」と、新しく増えた行の数
    async function refresh(full) {
      const markRead = document.visibilityState === "visible";
      // 同じ時刻の行（サーバーは sent_at > after で返す）と、ミリ秒より細かい時刻の切り捨てで落とさないよう 1ms 戻す。
      // 重なって返ってきた行は id で畳む
      const after = full || listCursor === null ? null : new Date(listCursor - 1).toISOString();
      const result = await call("list", { ...(after ? { after } : {}), markRead });
      const before = { title, guestName, lastReadByOwnerAt };
      if (result.title) setTitle(result.title);
      if (result.guestName) guestName = result.guestName;
      lastReadByOwnerAt = result.lastReadByOwnerAt || null;
      const incoming = Array.isArray(result.messages) ? result.messages : [];
      let added = 0;
      if (full) {
        listCursor = null;
        added = incoming.length;
        messages = incoming.slice();
      } else {
        const known = new Set(messages.map((m) => m.id));
        for (const m of incoming) if (!known.has(m.id)) { messages.push(m); added += 1; }
      }
      advanceCursor(incoming);
      messages.sort((a, b) => Date.parse(a.sentAt) - Date.parse(b.sentAt));
      const changed = full || added > 0 || before.lastReadByOwnerAt !== lastReadByOwnerAt
        || before.title !== title || before.guestName !== guestName;
      return { changed, added };
    }
    async function poll() {
      if (polling || stopped || document.visibilityState !== "visible") return;
      polling = true;
      try {
        const nearBottom = isNearBottom();
        const { changed, added } = await refresh(false);
        hideBanner();
        // ▲ 何も変わっていなければ描き直さない。やり取りの欄は読み上げの対象（role=log）なので、
        //   15秒ごとに中身を作り直すと、読み上げを使う人に会話全体が繰り返し読まれる
        if (changed) render(nearBottom);
        if (added && !nearBottom) $("newer").hidden = false;
      } catch (error) {
        if (!handleCommonError(error)) showBanner(error.message, true);
      } finally {
        polling = false;
      }
    }
    function startPolling() {
      stopPolling();
      if (stopped) return;
      pollTimer = setInterval(poll, POLL_MS);
    }
    function stopPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
    }
    // 画面が隠れているあいだは読みに行かない（読んでいないのに「既読」を付けないため）。戻ったらすぐ読む
    document.addEventListener("visibilitychange", () => {
      if ($("chat").hidden) return;
      if (document.visibilityState === "visible") { poll(); startPolling(); } else { stopPolling(); }
    });

    function showBanner(message, retry) {
      const el = $("banner");
      el.replaceChildren(document.createTextNode(message));
      if (retry) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "secondary";
        button.textContent = "もう一度";
        button.addEventListener("click", poll);
        el.appendChild(button);
      }
      el.hidden = false;
    }
    function hideBanner() { $("banner").hidden = true; }

    // ---------- 描く（中身はすべて textContent。相手が何を書いても HTML にしない） ----------
    const dayFormatter = new Intl.DateTimeFormat("ja-JP", { timeZone: ZONE, year: "numeric", month: "long", day: "numeric", weekday: "short" });
    const dayKeyFormatter = new Intl.DateTimeFormat("en-CA", { timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit" });
    const timeFormatter = new Intl.DateTimeFormat("ja-JP", { timeZone: ZONE, hour: "2-digit", minute: "2-digit", hour12: false });

    function isNearBottom() {
      const log = $("log");
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }
    // いちばん下を見ているか。画像は読み終わってから高さが決まるので、読み終わったときにこれが true なら下へ送り直す
    let pinnedToBottom = true;
    function scrollToBottom() {
      const log = $("log");
      log.scrollTop = log.scrollHeight;
      pinnedToBottom = true;
      $("newer").hidden = true;
    }
    $("newer").addEventListener("click", scrollToBottom);
    $("log").addEventListener("scroll", () => {
      pinnedToBottom = isNearBottom();
      if (pinnedToBottom) $("newer").hidden = true;
    });

    // body は文字か、添付を描いた Node
    function bubbleRow(kind, body, metaParts) {
      const row = document.createElement("div");
      row.className = `row ${kind}`;
      const bubble = document.createElement("div");
      bubble.className = body instanceof Node ? "bubble media" : "bubble";
      const who = document.createElement("span");
      who.className = "sr-only";
      who.textContent = kind === "guest" ? "あなた: " : `${title || "相手"}: `;
      bubble.appendChild(who);
      bubble.appendChild(body instanceof Node ? body : document.createTextNode(body));
      const meta = document.createElement("div");
      meta.className = "meta";
      for (const part of metaParts) {
        if (part instanceof Node) meta.appendChild(part);
        else { const line = document.createElement("div"); line.textContent = part; meta.appendChild(line); }
      }
      row.append(bubble, meta);
      return row;
    }

    function render(stickToBottom) {
      const log = $("log");
      log.replaceChildren();
      if (!messages.length && !pending.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = title
          ? `${title} さんとのやり取りがここに並びます。下の欄からメッセージを送れます。`
          : "やり取りがここに並びます。";
        log.appendChild(empty);
        return;
      }
      const readUpTo = lastReadByOwnerAt ? Date.parse(lastReadByOwnerAt) : null;
      let lastDay = null;
      for (const m of messages) {
        const at = new Date(m.sentAt);
        const dayKey = dayKeyFormatter.format(at);
        if (dayKey !== lastDay) {
          lastDay = dayKey;
          const pill = document.createElement("div");
          pill.className = "day-pill";
          pill.textContent = dayFormatter.format(at);
          log.appendChild(pill);
        }
        const kind = m.from === "guest" ? "guest" : "owner";
        const parts = [];
        if (kind === "guest" && readUpTo !== null && at.getTime() <= readUpTo) parts.push("既読");
        parts.push(timeFormatter.format(at));
        log.appendChild(bubbleRow(kind, attachmentNode(m) || m.body, parts));
      }
      for (const p of pending) {
        const content = p.attachment ? pendingAttachmentNode(p) : p.body;
        if (p.failed) {
          const failed = document.createElement("div");
          const label = document.createElement("span");
          label.className = "failed";
          label.textContent = p.error || "送れませんでした";
          const retry = document.createElement("button");
          retry.type = "button";
          retry.textContent = "もう一度送る";
          retry.addEventListener("click", () => sendPending(p));
          const discard = document.createElement("button");
          discard.type = "button";
          discard.textContent = "取り消す";
          discard.style.marginLeft = "8px";
          discard.addEventListener("click", () => {
            pending = pending.filter((x) => x !== p);
            if (p.previewURL) URL.revokeObjectURL(p.previewURL);
            render(false);
          });
          failed.append(label, document.createElement("br"), retry, discard);
          log.appendChild(bubbleRow("guest", content, [failed]));
        } else {
          const status = document.createElement("div");
          status.textContent = p.attachment ? progressText(p) : "送信中…";
          p.statusEl = status;
          log.appendChild(bubbleRow("guest", content, [status]));
        }
      }
      if (stickToBottom) scrollToBottom();
    }

    // ---------- 送る ----------
    const textEl = $("text");
    function updateComposer() {
      // 打った分だけ欄を伸ばす（上限は画面の4割。CSS の max-height）
      if (textEl.offsetParent !== null) {
        textEl.style.height = "auto";
        textEl.style.height = textEl.scrollHeight + 2 + "px";
      }
      const count = [...textEl.value].length;
      const counter = $("counter");
      counter.hidden = count < MAX_CHARS - 500;
      counter.textContent = `${count} / ${MAX_CHARS}`;
      counter.classList.toggle("over", count > MAX_CHARS);
      $("send").disabled = !textEl.value.trim() || count > MAX_CHARS;
    }
    textEl.addEventListener("input", updateComposer);
    // パソコンでは ⌘/Ctrl + Enter で送る（Enter だけは改行。日本語の変換の確定と取り違えない）
    textEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && !event.isComposing) {
        event.preventDefault();
        $("composer").requestSubmit();
      }
    });

    $("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const body = textEl.value.trim();
      if (!body || [...body].length > MAX_CHARS) return;
      const item = { clientMessageId: crypto.randomUUID(), body, failed: false };
      showAttachError(null); // 前に断ったファイルの話は、次に何か送った時点で消す
      pending.push(item);
      textEl.value = "";
      updateComposer();
      render(true);
      sendPending(item);
    });

    // ---------- 添付（画像・ファイル） ----------
    function formatSize(bytes) {
      if (bytes >= 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
      if (bytes >= 1024) return `${Math.round(bytes / 1024)}KB`;
      return `${bytes}B`;
    }
    function extensionOf(name) {
      const i = name.lastIndexOf(".");
      return i > 0 ? name.slice(i + 1).toLowerCase() : "";
    }
    // 名前は 200 コードポイントまで。拡張子を残して前を詰める
    function fitName(name) {
      const chars = [...name];
      if (chars.length <= NAME_MAX) return name;
      const ext = extensionOf(name);
      const keep = NAME_MAX - (ext ? ext.length + 1 : 0);
      return chars.slice(0, keep).join("") + (ext ? "." + ext : "");
    }
    // ▲ 読める画像は長い辺 2560px の JPEG に描き直す。写真の中の位置情報（撮った場所）などを落とし、大きさも減らすため。
    //   GIF（動く）と、このブラウザが読めない画像（HEIC など）はそのまま送る
    async function reencodeImage(file) {
      try {
        const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
        const scale = Math.min(1, REENCODE_EDGE / Math.max(bitmap.width, bitmap.height));
        const w = Math.max(1, Math.round(bitmap.width * scale));
        const h = Math.max(1, Math.round(bitmap.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; // 透明な PNG は白地に（JPEG は透明を持てない）
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(bitmap, 0, 0, w, h);
        if (bitmap.close) bitmap.close();
        return await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", REENCODE_QUALITY));
      } catch {
        return null;
      }
    }
    async function prepareAttachment(file) {
      const entry = ALLOWED[extensionOf(file.name)];
      if (!entry) throw new Error(NOT_ALLOWED);
      let [mimeType, type] = entry;
      let blob = file;
      let name = fitName(file.name);
      if (type === "image" && mimeType !== "image/gif") {
        const redrawn = await reencodeImage(file);
        if (redrawn) {
          blob = redrawn;
          mimeType = "image/jpeg";
          name = fitName(name.replace(/\.[^.]+$/, "") + ".jpg");
        }
      }
      if (blob.size === 0) throw new Error("空のファイルは送れません。");
      if (blob.size > (type === "image" ? IMAGE_MAX : FILE_MAX)) throw new Error(TOO_LARGE);
      return { blob, name, mimeType, type, size: blob.size };
    }
    function showAttachError(message) {
      const el = $("attach-error");
      el.textContent = message || "";
      el.hidden = !message;
    }
    $("attach").addEventListener("click", () => { showAttachError(null); $("file-input").click(); });
    $("file-input").addEventListener("change", async (event) => {
      const files = [...event.target.files];
      event.target.value = ""; // 同じファイルをもう一度選べるように
      for (const file of files) {
        let prepared;
        try {
          prepared = await prepareAttachment(file);
        } catch (error) {
          showAttachError(`${file.name}: ${error.message}`);
          continue;
        }
        const item = {
          clientMessageId: crypto.randomUUID(), attachment: true, failed: false,
          ...prepared, body: prepared.type === "image" ? "[画像]" : `[ファイル] ${prepared.name}`,
          previewURL: prepared.type === "image" ? URL.createObjectURL(prepared.blob) : null,
          uploadId: null, uploaded: false, progress: 0,
        };
        pending.push(item);
        render(true);
        await sendPending(item); // 1つずつ順に送る（並べると順番が入れ替わる）
      }
    });

    function progressText(p) {
      return p.uploaded ? "送信中…" : `送信中… ${Math.round(p.progress * 100)}%`;
    }
    // 上げる。進み具合が分かるように XMLHttpRequest で（fetch には上げる側の進み具合が無い）
    function putFile(url, item) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("PUT", url);
        xhr.setRequestHeader("Content-Type", item.mimeType);
        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          item.progress = e.loaded / e.total;
          if (item.statusEl) item.statusEl.textContent = progressText(item);
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
          ? resolve()
          : reject(new ApiError(xhr.status, { error: "ファイルを上げられませんでした。もう一度お試しください。", uploadFailed: true }));
        xhr.onerror = () => reject(new ApiError(0, { error: "つながりません。電波の状態を確かめて、もう一度お試しください。", uploadFailed: true }));
        xhr.send(item.blob);
      });
    }

    // 署名つきの URL（5分）。同じ行は期限まで使い回す（描き直すたびに取り直さない）
    const fileURLs = new Map(); // messageId → { url, expiresAt }
    async function fileURL(messageId) {
      const cached = fileURLs.get(messageId);
      if (cached && cached.expiresAt - Date.now() > 30000) return cached.url;
      const result = await call("file", { messageId });
      const expiresAt = Date.parse(result.expiresAt) || (Date.now() + 240000);
      fileURLs.set(messageId, { url: result.url, expiresAt });
      return result.url;
    }
    function fileCard(name, size, onOpen) {
      const card = document.createElement("div");
      card.className = "file-card";
      const icon = document.createElement("div");
      icon.className = "icon";
      icon.setAttribute("aria-hidden", "true");
      icon.textContent = (extensionOf(name) || "FILE").toUpperCase().slice(0, 4);
      const info = document.createElement("div");
      const fname = document.createElement("div");
      fname.className = "fname";
      fname.textContent = name;
      const fsize = document.createElement("div");
      fsize.className = "fsize";
      fsize.textContent = formatSize(size || 0);
      info.append(fname, fsize);
      if (onOpen) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "ダウンロード";
        button.addEventListener("click", onOpen);
        info.appendChild(button);
      }
      card.append(icon, info);
      return card;
    }
    // ▲ ダウンロードは**中身を受け取ってから**手元で保存させる。署名つき URL へページごと移ると、
    //   Storage が失敗（期限切れなど）を返したときにチャットのページから離れてしまう。
    //   新しいタブで開くのは、await のあとだとポップアップとして止められる
    async function downloadAttachment(messageId, name) {
      try {
        const response = await fetch(await fileURL(messageId), { cache: "no-store", credentials: "omit" });
        if (!response.ok) throw new ApiError(response.status, { error: "取り出せませんでした。もう一度お試しください。" });
        const objectURL = URL.createObjectURL(await response.blob());
        const link = document.createElement("a");
        link.href = objectURL;
        link.download = name;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectURL), 60000);
      } catch (error) {
        if (!(error instanceof ApiError) || !handleCommonError(error)) showBanner(error.message, false);
      }
    }

    // ▲ 画像は**見えたときだけ**署名つき URL を取りに行く。全部いっぺんに取ると、画像の多い会話を開いた瞬間に
    //   関数への要求と原寸の画像（無料プランでは縮小できない）が何十本も走る
    const imageObserver = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            imageObserver.unobserve(entry.target);
            const load = entry.target._load;
            if (load) load();
          }
        }, { root: $("log"), rootMargin: "400px 0px" })
      : null;

    // 画像を大きく見る（ページの中に重ねる。新しいタブで開くと、URL の期限が切れていると開けない）
    function showLightbox(src, name, messageId) {
      const overlay = document.createElement("div");
      overlay.className = "lightbox";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-label", `画像（${name}）`);
      const img = document.createElement("img");
      img.src = src;
      img.alt = `画像（${name}）`;
      const bar = document.createElement("div");
      bar.className = "lightbox-bar";
      const save = document.createElement("button");
      save.type = "button";
      save.textContent = "保存";
      save.addEventListener("click", () => downloadAttachment(messageId, name));
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "閉じる";
      const dismiss = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
      const onKey = (event) => { if (event.key === "Escape") dismiss(); };
      close.addEventListener("click", dismiss);
      overlay.addEventListener("click", (event) => { if (event.target === overlay) dismiss(); });
      document.addEventListener("keydown", onKey);
      bar.append(save, close);
      overlay.append(bar, img);
      document.body.appendChild(overlay);
      close.focus();
    }

    // サーバーから来た行の添付。知らない形なら null（置き換えの文字の吹き出しになる）
    function attachmentNode(m) {
      const a = m.attachment;
      if (!a || (a.type !== "image" && a.type !== "file")) return null;
      const name = typeof a.name === "string" && a.name ? a.name : (a.type === "image" ? "画像" : "ファイル");
      const download = () => downloadAttachment(m.id, name);
      if (a.type === "file") return fileCard(name, a.size, download);
      const button = document.createElement("button");
      button.type = "button";
      button.className = "attach-image";
      const img = document.createElement("img");
      img.alt = `画像（${name}）`;
      img.decoding = "async";
      img.loading = "lazy";
      button.appendChild(img);
      // ブラウザが読めない画像（HEIC など）はファイルとして渡す
      img.addEventListener("error", () => button.replaceWith(fileCard(name, a.size, download)), { once: true });
      img.addEventListener("load", () => { if (pinnedToBottom) scrollToBottom(); }, { once: true });
      button._load = () => fileURL(m.id)
        .then((url) => { img.src = url; })
        .catch(() => button.replaceWith(fileCard(name, a.size, download)));
      if (imageObserver) imageObserver.observe(button); else button._load();
      button.addEventListener("click", () => { if (img.currentSrc) showLightbox(img.currentSrc, name, m.id); });
      return button;
    }
    function pendingAttachmentNode(p) {
      if (p.type === "image" && p.previewURL) {
        const wrap = document.createElement("div");
        wrap.className = "attach-image";
        const img = document.createElement("img");
        img.alt = `送っている画像（${p.name}）`;
        img.src = p.previewURL;
        wrap.appendChild(img);
        return wrap;
      }
      return fileCard(p.name, p.size, null);
    }
    function finishPending(item, result) {
      pending = pending.filter((x) => x !== item);
      if (item.previewURL) URL.revokeObjectURL(item.previewURL);
      if (result.message && !messages.some((m) => m.id === result.message.id)) messages.push(result.message);
      render(true);
    }

    async function sendPending(item) {
      item.failed = false;
      render(true);
      if (item.attachment) {
        try {
          // ▲ 上げ終わっていれば送るだけをやり直す。送り直しも同じ clientMessageId（サーバーが2通にしない）
          if (!item.uploaded) {
            const slot = await call("upload", {
              name: item.name, mimeType: item.mimeType, size: item.size, clientMessageId: item.clientMessageId,
            });
            item.uploadId = slot.uploadId;
            await putFile(slot.uploadUrl, item);
            item.uploaded = true;
            if (item.statusEl) item.statusEl.textContent = progressText(item);
          }
          finishPending(item, await call("send", { uploadId: item.uploadId, clientMessageId: item.clientMessageId }));
        } catch (error) {
          if (error.body && error.body.uploadFailed) item.uploaded = false; // 上げ直す（署名つきの URL は取り直す）
          handleSendError(item, error);
        }
        return;
      }
      try {
        // ▲ 送り直しも同じ clientMessageId。サーバーは同じものを2通にしない（届いていたのに返事だけ落ちたときの二重送信を防ぐ）
        finishPending(item, await call("send", { text: item.body, clientMessageId: item.clientMessageId }));
      } catch (error) {
        handleSendError(item, error);
      }
    }

    // 送れなかったとき（文字も添付も同じ扱い）
    function handleSendError(item, error) {
      if (error.status === 409 && error.body.needsName) {
        // 名前を入れ直してもらう。打った本文は送れなかった行として残す
        item.failed = true;
        item.error = "先にお名前を入れてください";
        showName();
        return;
      }
      if (error.status === 404 || (error.status === 401 && error.body.needsPasscode)) {
        pending = pending.filter((x) => x !== item);
        if (!item.attachment) textEl.value = item.body; // 打った本文を捨てない
        else if (item.previewURL) URL.revokeObjectURL(item.previewURL);
        handleCommonError(error);
        return;
      }
      item.failed = true;
      if (error.status === 429 && error.body.retryAfter) {
        const minutes = Math.max(1, Math.ceil(error.body.retryAfter / 60));
        item.error = `${error.message}（あと${minutes}分ほど）`;
      } else {
        item.error = error.message || "送れませんでした";
      }
      render(true);
    }

    updateComposer();
    window.addEventListener("hashchange", () => location.reload());
    start();
  })();
  </script>
</body>
</html>
